[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrailbench"
version = "1.0.0rc1"
description = "Open benchmark for AI guardrail products"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
hf = ["transformers", "torch"]
llamafirewall = ["llamafirewall==1.0.3"]
nemo = ["nemoguardrails==0.24.1"]
llmguard = ["llm-guard==0.3.16"]
invariant = ["invariant-ai[extras]==0.3.5"]
bedrock = ["boto3"]
modelarmor = ["google-auth", "requests"]

[project.scripts]
guardrailbench = "guardrailbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["cases", "web"]

[tool.ruff.lint]
# Errors that are real bugs (syntax, undefined names, bad comparisons). Style rules are left off
# until the codebase is formatted in a separate change.
select = ["E9", "F63", "F7", "F82"]

name: CI
on:
  push:
    branches: [main, v1-cases]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest -q
      - run: uv run guardrailbench validate cases/practice
      - run: uv run guardrailbench casegen lint cases/practice/v1.jsonl
